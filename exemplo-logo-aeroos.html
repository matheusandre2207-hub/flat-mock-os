<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Logo AeroOS</title>
<meta name="aeroos-icon" content="✈️">
<style>
  :root { --bg: #0a0a0c; --fg: #f4f4f5; --muted: #71717a; color-scheme: dark; }
  @media (prefers-color-scheme: light) {
    :root { --bg: #fafafa; --fg: #18181b; --muted: #a1a1aa; color-scheme: light; }
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--fg); }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
    overflow: hidden; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 36px 24px;
  }
  h1 {
    font-weight: 200; font-size: clamp(34px, 11vw, 56px); line-height: 1; letter-spacing: 0.04em;
    animation: rise 1.4s cubic-bezier(.22, 1, .36, 1) both;
  }
  .line {
    width: 56px; height: 1px; background: var(--muted);
    animation: grow 1.2s 0.4s cubic-bezier(.22, 1, .36, 1) both;
  }
  p {
    font-size: 10px; letter-spacing: 0.26em; text-transform: uppercase; color: var(--muted);
    animation: fade 1.2s 0.9s both;
  }
  @keyframes rise {
    from { opacity: 0; letter-spacing: 0.42em; filter: blur(6px); }
    to   { opacity: 1; letter-spacing: 0.04em; filter: blur(0); }
  }
  @keyframes grow { from { transform: scaleX(0); opacity: 0; } to { transform: scaleX(1); opacity: 1; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
</style>
</head>
<body>
  <h1>AeroOS</h1>
  <div class="line"></div>
  <p>Powered by UNiVERSE</p>
</body>
</html>
